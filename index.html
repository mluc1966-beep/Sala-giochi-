<!doctype html>
<html lang="it">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
  <meta name="theme-color" content="#18233b" />
  <title>Sala Giochi 2.0</title>
  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="icon" href="icon.svg" type="image/svg+xml" />
  <link rel="stylesheet" href="styles.css" />
  <link rel="stylesheet" href="nextgen.css?v=2.10.2" />
  <link rel="stylesheet" href="nomi-cose-citta.css?v=2.11.0" />
</head>
<body>
  <header class="topbar">
    <button id="backBtn" class="icon-btn hidden" aria-label="Indietro">←</button>
    <div>
      <h1 id="pageTitle">Sala Giochi</h1>
      <p id="pageSub">Un solo giocatore · archivio locale</p>
    </div>
    <button id="homeBtn" class="icon-btn hidden" aria-label="Home">⌂</button>
  </header>

  <main id="app" class="app"></main>

  <dialog id="difficultyDialog" class="dialog">
    <form method="dialog" class="dialog-card">
      <h2 id="difficultyTitle">Scegli difficoltà</h2>
      <div class="difficulty-grid">
        <button value="easy" class="difficulty easy"><span>●</span> Facile</button>
        <button value="medium" class="difficulty medium"><span>●</span> Medio</button>
        <button value="hard" class="difficulty hard"><span>●</span> Difficile</button>
        <button value="extreme" class="difficulty extreme"><span>✦</span> Difficilissimo</button>
      </div>
      <button value="cancel" class="secondary">Annulla</button>
    </form>
  </dialog>

  <dialog id="helpDialog" class="dialog utility-dialog">
    <div class="dialog-card">
      <div class="dialog-title-row"><div><h2 id="helpTitle">Come si gioca</h2><p id="helpLevel"></p></div><button class="dialog-x" type="button" onclick="document.getElementById('helpDialog').close()">×</button></div>
      <div id="helpContent" class="help-content"></div>
      <button class="primary wide" type="button" onclick="document.getElementById('helpDialog').close()">Ho capito</button>
    </div>
  </dialog>

  <dialog id="notesDialog" class="dialog notes-dialog">
    <div class="dialog-card notes-card">
      <div class="dialog-title-row"><div><h2>📝 Taccuino</h2><p id="notesContext">Appunti della partita</p></div><button class="dialog-x" type="button" onclick="closeNotes()">×</button></div>
      <div class="notes-tools">
        <button id="copyCurrentBtn" class="secondary" type="button">📌 Copia elemento attuale</button>
        <button id="clearNotesBtn" class="secondary danger" type="button">Cancella foglio</button>
      </div>
      <textarea id="notesArea" class="notes-area" spellcheck="false" placeholder="Scrivi qui indizi, calcoli, ipotesi, combinazioni..."></textarea>
      <div class="mini-calc">
        <label for="calcInput">Calcolo rapido</label>
        <div class="calc-row"><input id="calcInput" inputmode="decimal" placeholder="es. (24+41)-9"><button id="calcBtn" class="secondary" type="button">=</button><output id="calcResult">—</output></div>
      </div>
      <p class="notes-save">Salvataggio automatico locale per questa sessione.</p>
    </div>
  </dialog>

  <div id="toast" class="toast" role="status" aria-live="polite"></div>
  <script src="app.js"></script>
  <script src="nextgen.js?v=2.10.2"></script>
  <script src="nomi-cose-citta.js?v=2.11.0"></script>
</body>
</html>
